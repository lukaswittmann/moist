# Codecov configuration for MOIST

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

parsers:
  cobertura:
    partials_as_hits: true

# Merge the two coverage legs
#   fortran   the Fortran unit tests and the C API example
#   coupling  the Python bindings and the PySCF coupling tests
flags:
  fortran:
    paths:
      - src/
    carryforward: false
  coupling:
    paths:
      - src/
      - python/moist/
    carryforward: false

ignore:
  - "subprojects"
  - "test"
  - "app"
  - "python/tests"
  - "config"
  - "build"

  # BLAS/LAPACK wrappers
  - "src/moist/math/blas"
  - "src/moist/math/blas.f90"
  - "src/moist/math/lapack"
  - "src/moist/math/lapack.f90"

  # Included external projects as subprojects
  - "src/moist/math/linalg/lsmr/"
  - "src/moist/math/linalg/lsqr/"
  - "src/moist/math/linalg/lusol/"
  - "src/moist/math/solver/fmin/"
  - "src/moist/math/solver/lbfgsb/"
  - "src/moist/math/solver/newton/"
  - "src/moist/math/solver/slsqp/"

  # FFT backends
  - "src/moist/math/fft/ducc0/"
  - "src/moist/math/fft/finufft/"
  - "src/moist/math/fft/xsimd/"

  # Quadrature tables
  - "src/moist/math/grid/angular/lebedev.f90"

  # Parameter tables
  - "src/moist/data"

  # Presentation-only output
  - "src/moist/output/citations.f90"
  - "src/moist/output/format.f90"
  - "src/moist/output/license.f90"

name: Feature request
description: Request some new model, cavity, component, API extension, or some other feature
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would you like this feature?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How do do you think this feature could look like/could be used?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Papers, existing implementations, or related issues
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this myself

name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run version sync check
        run: bash config/sync-version.sh --check

  ubuntu:
    name: ubuntu (${{ matrix.toolchain.build }}, ${{ matrix.toolchain.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - {build: meson, name: gnu13,   compiler: gcc,   version: '13',     fc: gfortran, cc: gcc}
          - {build: meson, name: gnu14,   compiler: gcc,   version: '14',     fc: gfortran, cc: gcc}
          - {build: meson, name: intel25, compiler: intel, version: '2025.1', mkl_version: '2025.1', fc: ifx, cc: icx}
          - {build: fpm,   name: gnu14,   compiler: gcc,   version: '14',     fc: gfortran, cc: gcc}
          - {build: fpm,   name: intel25, compiler: intel, version: '2025.1', mkl_version: '2025.1', fc: ifx, cc: icx}
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build liblapack-dev libunwind-dev

      - name: Install Intel MKL
        if: matrix.toolchain.compiler == 'intel'
        run: |
          sudo apt-get install -y \
            intel-oneapi-mkl-${{ matrix.toolchain.mkl_version }} \
            intel-oneapi-mkl-devel-${{ matrix.toolchain.mkl_version }}

      - name: Setup Intel oneAPI environment
        if: matrix.toolchain.compiler == 'intel'
        run: |
          source /opt/intel/oneapi/setvars.sh --force
          printenv >> "$GITHUB_ENV"

      - name: Set compiler environment
        run: |
          echo "FC=${{ matrix.toolchain.fc }}" >> "$GITHUB_ENV"
          echo "CC=${{ matrix.toolchain.cc }}" >> "$GITHUB_ENV"

      - name: Install fpm
        if: matrix.toolchain.build == 'fpm'
        uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: 'v0.13.0'

      - name: Build and test (meson)
        if: matrix.toolchain.build == 'meson'
        run: |
          meson setup build
          meson compile -C build
          meson test -C build --suite moist --print-errorlogs

      - name: Build and test (fpm)
        if: matrix.toolchain.build == 'fpm'
        run: |
          export OMP_STACKSIZE=128M
          fflags="-fopenmp"
          if [ "${{ matrix.toolchain.compiler }}" = "intel" ]; then fflags="$fflags -fp-model=precise"; fi
          fpm build --compiler "$FC" --c-compiler "$CC" --flag "$fflags" --link-flag -fopenmp
          fpm test --compiler "$FC" --c-compiler "$CC" --flag "$fflags" --link-flag -fopenmp

  macos:
    name: macos (${{ matrix.toolchain.build }}, ${{ matrix.toolchain.name }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - {build: meson, name: gnu13, compiler: gcc, version: '13'}
          - {build: meson, name: gnu14, compiler: gcc, version: '14'}
          - {build: fpm,   name: gnu14, compiler: conda-gcc, version: '14.3'}
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        if: matrix.toolchain.compiler == 'gcc'
        id: setup-fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Install compiler and fpm (conda-forge)
        if: matrix.toolchain.compiler == 'conda-gcc'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fortran
          create-args: gfortran=${{ matrix.toolchain.version }} fpm=0.13.0
          condarc: |
            channels:
              - conda-forge
          init-shell: bash

      - name: Install dependencies (macOS)
        run: brew install meson ninja

      - name: Install fpm
        if: matrix.toolchain.build == 'fpm' && matrix.toolchain.compiler != 'conda-gcc'
        uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: 'v0.13.0'

      - name: Install netlib LAPACK (macOS fpm)
        if: matrix.toolchain.build == 'fpm'
        run: brew install lapack

      - name: Set compiler environment
        if: matrix.toolchain.compiler == 'gcc'
        run: |
          # Resolve `gcc`/`gfortran` on macOS
          echo "FC=${{ steps.setup-fortran.outputs.fc }}" >> "$GITHUB_ENV"
          echo "CC=${{ steps.setup-fortran.outputs.cc }}" >> "$GITHUB_ENV"

      - name: Set compiler environment (conda-forge)
        if: matrix.toolchain.compiler == 'conda-gcc'
        shell: bash -leo pipefail {0}
        run: |
          echo "FC=$(command -v gfortran)" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          dirname "$(command -v fpm)" >> "$GITHUB_PATH"

      - name: Build and test (meson)
        if: matrix.toolchain.build == 'meson'
        run: |
          meson setup build -Dlapack=accelerate
          meson compile -C build
          meson test -C build --suite moist --print-errorlogs

      - name: Build and test (fpm)
        if: matrix.toolchain.build == 'fpm'
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          export OMP_STACKSIZE=128M
          flags="-O2 -fopenmp"
          link_flag="-fopenmp -L$(brew --prefix lapack)/lib"
          fpm build --compiler "$FC" --c-compiler "$CC" --flag "$flags" --link-flag "$link_flag"
          fpm test --compiler "$FC" --c-compiler "$CC" --flag "$flags" --link-flag "$link_flag"

  python:
    name: python (${{ matrix.name }}, gnu14, pyscf)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubuntu, os: ubuntu-24.04, lapack: auto}
          - {name: macos,  os: macos-14,     lapack: accelerate}
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        id: setup-fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: '14'

      - name: Set compiler environment
        run: |
          echo "FC=${{ steps.setup-fortran.outputs.fc }}" >> "$GITHUB_ENV"
          echo "CC=${{ steps.setup-fortran.outputs.cc }}" >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build liblapack-dev libunwind-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade cffi setuptools pytest numpy pyscf

      - name: Verify pyscf is importable
        run: python -c "from pyscf import dft, grad, gto, scf; import pyscf; print(pyscf.__version__)"

      - name: Build and test
        run: |
          meson setup build -Dpython=true -Dapi=true -Dpython_version="$(command -v python)" -Dlapack=${{ matrix.lapack }}
          meson compile -C build
          meson test -C build --suite moist --print-errorlogs

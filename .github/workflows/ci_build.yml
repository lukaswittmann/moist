name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push cancels the running PR build; pushes to main each get their own group
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  version-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run version sync check
        run: bash config/sync-version.sh --check

  # System toolchains: apt GCC (PPA) and oneAPI on Linux, Homebrew GCC on macOS
  native:
    name: ${{ matrix.platform }} (${{ matrix.build }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04, build: meson, name: gnu15, compiler: gcc, version: '15', lapack: auto, timeout: 30}
          - {platform: linux-x86_64, os: ubuntu-24.04, build: cmake, name: gnu15, compiler: gcc, version: '15', lapack: auto, timeout: 30}
          - {platform: linux-x86_64, os: ubuntu-24.04, build: meson, name: intel25, compiler: intel, version: '2025.1', lapack: mkl, timeout: 30}
          - {platform: linux-x86_64, os: ubuntu-24.04, build: cmake, name: intel25, compiler: intel, version: '2025.1', lapack: mkl, timeout: 30}
          - {platform: linux-x86_64, os: ubuntu-24.04, build: meson, name: gnu15-ilp64, compiler: gcc, version: '15', lapack: openblas, meson_args: '-Dilp64=true', timeout: 30}
          - {platform: linux-x86_64, os: ubuntu-24.04, build: meson, name: gnu14-debug, compiler: gcc, version: '14', lapack: auto, meson_args: '-Dbuildtype=debug', test_args: '--timeout-multiplier 4', fflags: '-fcheck=bounds,do,mem,pointer', cxxflags: '-D_GLIBCXX_ASSERTIONS', timeout: 60}
          - {platform: linux-arm64, os: ubuntu-24.04-arm, build: meson, name: gnu15, compiler: gcc, version: '15', lapack: auto, timeout: 30}
          - {platform: linux-arm64, os: ubuntu-24.04-arm, build: cmake, name: gnu15, compiler: gcc, version: '15', lapack: auto, timeout: 30}
          - {platform: macos-arm64, os: macos-15, build: meson, name: gnu15, compiler: gcc, version: '15', lapack: accelerate, timeout: 45}
          - {platform: macos-arm64, os: macos-15, build: cmake, name: gnu15, compiler: gcc, version: '15', lapack: accelerate, timeout: 45}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install compiler
        id: setup-fortran
        uses: fortran-lang/setup-fortran@be037f0a45b1160f139d4ccd0b96f9e9bfd6a682 # v1.10.0
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake liblapack-dev libunwind-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Install ILP64 BLAS/LAPACK
        if: contains(matrix.meson_args, 'ilp64')
        run: sudo apt-get install -y libopenblas64-dev

      - name: Install Intel MKL
        if: matrix.compiler == 'intel'
        run: |
          sudo apt-get install -y \
            intel-oneapi-mkl-${{ matrix.version }} \
            intel-oneapi-mkl-devel-${{ matrix.version }}

      - name: Setup Intel oneAPI environment
        if: matrix.compiler == 'intel'
        run: |
          source /opt/intel/oneapi/setvars.sh --force
          printenv >> "$GITHUB_ENV"

      - name: Set compiler environment
        run: |
          {
            echo "FC=${{ steps.setup-fortran.outputs.fc }}"
            echo "CC=${{ steps.setup-fortran.outputs.cc }}"
            echo "CXX=${{ steps.setup-fortran.outputs.cxx }}"
            echo "FFLAGS=${{ matrix.fflags }}"
            echo "CXXFLAGS=${{ matrix.cxxflags }}"
          } >> "$GITHUB_ENV"

      - name: Build and test (meson)
        if: matrix.build == 'meson'
        run: |
          meson setup build -Dlapack=${{ matrix.lapack }} ${{ matrix.meson_args }}
          meson compile -C build
          meson test -C build --suite moist --print-errorlogs ${{ matrix.test_args }}

      - name: Build and test (cmake)
        if: matrix.build == 'cmake'
        run: |
          meson subprojects download
          cmake -B build -G Ninja -DMOIST_LAPACK=${{ matrix.lapack }}
          cmake --build build
          ctest --test-dir build --output-on-failure -j 4

  # conda-forge toolchains; the compiler activation sets FC/CC/CXX and the flags
  conda:
    name: ${{ matrix.platform }} (${{ matrix.build }}, conda-gnu15)
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-arm64, macos-arm64]
        build: [meson, cmake]
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04, lapack: openblas, timeout: 30,
             packages: 'gfortran_linux-64=15.2 gcc_linux-64=15.2 gxx_linux-64=15.2 openblas'}
          - {platform: linux-arm64, os: ubuntu-24.04-arm, lapack: openblas, timeout: 30,
             packages: 'gfortran_linux-aarch64=15.2 gcc_linux-aarch64=15.2 gxx_linux-aarch64=15.2 openblas'}
          # clang/libc++ and llvm-openmp as in the local dev env
          - {platform: macos-arm64, os: macos-15, lapack: accelerate, timeout: 45,
             packages: 'gfortran_osx-arm64=15.2 clang_osx-arm64=19 clangxx_osx-arm64=19 llvm-openmp'}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install toolchain (conda-forge)
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          environment-name: moist
          create-args: ${{ matrix.packages }} meson=1.12 ninja=1.13 cmake=4.4
          condarc: |
            channels:
              - conda-forge
          init-shell: bash
          cache-environment: true

      - name: Build and test (meson)
        if: matrix.build == 'meson'
        run: |
          meson setup build -Dlapack=${{ matrix.lapack }}
          meson compile -C build
          meson test -C build --suite moist --print-errorlogs

      - name: Build and test (cmake)
        if: matrix.build == 'cmake'
        run: |
          meson subprojects download
          cmake -B build -G Ninja -DMOIST_LAPACK=${{ matrix.lapack }}
          cmake --build build
          ctest --test-dir build --output-on-failure -j 4

  windows:
    name: windows-x86_64 (${{ matrix.build }}, msys2-gnu15)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        build: [meson, cmake]
    steps:
      # Keep LF line endings in sources and test data
      - name: Disable autocrlf
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install toolchain (MSYS2 UCRT64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p gcc-fortran:p meson:p ninja:p cmake:p pkgconf:p openblas:p

      - name: Build and test (meson)
        if: matrix.build == 'meson'
        run: |
          meson setup build -Dlapack=openblas
          meson compile -C build
          meson test -C build --suite moist --print-errorlogs

      - name: Build and test (cmake)
        if: matrix.build == 'cmake'
        run: |
          meson subprojects download
          cmake -B build -G Ninja -DMOIST_LAPACK=openblas
          cmake --build build
          ctest --test-dir build --output-on-failure -j 4

  python:
    name: python (${{ matrix.platform }}, py${{ matrix.python }}, gnu15, pyscf)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04,     python: '3.10', lapack: auto}
          - {platform: linux-x86_64, os: ubuntu-24.04,     python: '3.13', lapack: auto}
          - {platform: linux-arm64,  os: ubuntu-24.04-arm, python: '3.13', lapack: auto}
          - {platform: macos-arm64,  os: macos-15,         python: '3.13', lapack: accelerate}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install compiler
        id: setup-fortran
        uses: fortran-lang/setup-fortran@be037f0a45b1160f139d4ccd0b96f9e9bfd6a682 # v1.10.0
        with:
          compiler: gcc
          version: '15'

      - name: Set compiler environment
        run: |
          {
            echo "FC=${{ steps.setup-fortran.outputs.fc }}"
            echo "CC=${{ steps.setup-fortran.outputs.cc }}"
            echo "CXX=${{ steps.setup-fortran.outputs.cxx }}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build liblapack-dev libunwind-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: python -m pip install --upgrade cffi setuptools pytest numpy pyscf==2.13.1

      - name: Verify pyscf is importable
        run: python -c "from pyscf import dft, grad, gto, scf; import pyscf; print(pyscf.__version__)"

      - name: Build and test
        run: |
          meson setup build -Dpython=true -Dapi=true -Dpython_version="$(command -v python)" -Dlapack=${{ matrix.lapack }}
          meson compile -C build
          meson test -C build --suite moist --print-errorlogs

  wheel:
    name: wheel (${{ matrix.platform }}, gnu15, pyscf)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, os: ubuntu-24.04,     lapack: auto}
          - {platform: linux-arm64,  os: ubuntu-24.04-arm, lapack: auto}
          - {platform: macos-arm64,  os: macos-15,         lapack: accelerate}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install compiler
        id: setup-fortran
        uses: fortran-lang/setup-fortran@be037f0a45b1160f139d4ccd0b96f9e9bfd6a682 # v1.10.0
        with:
          compiler: gcc
          version: '15'

      - name: Set compiler environment
        run: |
          {
            echo "FC=${{ steps.setup-fortran.outputs.fc }}"
            echo "CC=${{ steps.setup-fortran.outputs.cc }}"
            echo "CXX=${{ steps.setup-fortran.outputs.cxx }}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build liblapack-dev libunwind-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest numpy pyscf==2.13.1

      - name: Source distribution with subprojects
        run: |
          meson setup dist -Dpython=false -Dapi=true -Dlapack=${{ matrix.lapack }}
          meson dist -C dist --no-tests --include-subprojects
          mkdir -p python/subprojects/moist
          tar -xJf dist/meson-dist/moist-*.tar.xz --strip-components=1 -C python/subprojects/moist

      - name: Build and install the wheel
        run: |
          python -m pip install -v ./python -Csetup-args=-Dlapack=${{ matrix.lapack }}
          python -c "import moist; print(moist.__version__, moist.get_version_string())"

      - name: Test the installed package
        env:
          MOIST_REQUIRE_PYSCF: 1
        run: pytest python/tests

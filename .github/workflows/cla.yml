name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# explicitly configure permissions, in case the GITHUB_TOKEN workflow permissions
# are set to read-only in the repository settings
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/lukaswittmann/moist/blob/main/CLA.md'
          branch: 'main'
          allowlist: lukaswittmann,bot*
          custom-notsigned-prcomment: 'Thank you for your contribution to MOIST! Before it can be merged, please read our [Contributor License Agreement](https://github.com/lukaswittmann/moist/blob/main/CLA.md) and sign it by posting the comment below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '**CLA Assistant bot** All contributors have signed the CLA. Thank you!'

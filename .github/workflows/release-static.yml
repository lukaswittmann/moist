name: Release Static-ish Binary

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release-static.yml
      - meson.build
      - meson_options.txt
      - config/**
      - app/**
      - src/moist/math/fft/**
      - subprojects/*.wrap
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing tag to build and publish to'
        required: false
        type: string

permissions:
  contents: read

# Tag and manual runs each get their own group; only PR runs cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-release:
    name: build-release (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64,  os: ubuntu-24.04}
          - {arch: aarch64, os: ubuntu-24.04-arm}
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          dnf install -y lapack-devel
          /opt/python/cp310-cp310/bin/pip install meson ninja
          echo "/opt/python/cp310-cp310/bin" >> "$GITHUB_PATH"

      - name: Configure with Meson
        env:
          FC: gfortran
          CC: gcc
          CXX: g++
          # gfortran drives the link and ignores -static-libstdc++; libstdc++ is bundled below
          LDFLAGS: -static-libgfortran -static-libgcc
        run: |
          meson setup build \
            --buildtype=release \
            -Ddefault_library=static \
            -Dopenmp=true

      - name: Build with Meson
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --suite moist --print-errorlogs

      - name: Prepare distributable bundle
        id: prepare
        env:
          TAG_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.inputs.tag || github.ref_name || 'manual' }}
        run: |
          set -euo pipefail

          # Branch names may contain '/', which breaks the tarball and artifact names
          tag="${TAG_NAME//\//-}"
          arch="$(uname -m)"
          asset_base="moist-${tag}-linux-${arch}"

          rm -rf dist
          mkdir -p dist/lib

          cp build/app/moist dist/moist
          ldd dist/moist

          # Bundle non-glibc runtime dependencies for easier redistribution.
          ldd dist/moist \
            | awk '/=> \/.*/ { print $(NF-1) } /^\// { print $1 }' \
            | grep -Ev '/(ld-linux|libc\.so\.6|libm\.so|libpthread\.so|librt\.so|libdl\.so|libresolv\.so|libnss_|libutil\.so)' \
            | sort -u \
            | while read -r lib; do
                if [ -f "$lib" ]; then
                  cp -L "$lib" dist/lib/
                fi
              done

          cat > dist/run-moist.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          this_dir="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${this_dir}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          exec "${this_dir}/moist" "$@"
          EOF
          chmod +x dist/run-moist.sh

          tar -C dist -czf "${asset_base}.tar.gz" .
          sha256sum "${asset_base}.tar.gz" > "${asset_base}.sha256"

          {
            echo "tag=${tag}"
            echo "asset_tar=${asset_base}.tar.gz"
            echo "asset_sha=${asset_base}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moist-release-${{ steps.prepare.outputs.tag }}-${{ matrix.arch }}
          path: |
            ${{ steps.prepare.outputs.asset_tar }}
            ${{ steps.prepare.outputs.asset_sha }}

  # Only this job may write; the build job runs PR code
  publish-release:
    needs: build-release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: moist-release-*
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          append_body: true
          files: |
            moist-*.tar.gz
            moist-*.sha256

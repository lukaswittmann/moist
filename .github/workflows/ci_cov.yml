name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    name: coverage (${{ matrix.leg.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: fortran
            setup: -Dpython=false
            tests: --suite moist
          - name: coupling
            setup: -Dpython=true -Dpython_version=python3
            tests: --suite moist:python
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: '14'

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build liblapack-dev libunwind-dev
      - name: Install gcovr
        run: |
          pipx install --force gcovr==8.6

      - uses: actions/setup-python@v5
        if: matrix.leg.name == 'coupling'
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: matrix.leg.name == 'coupling'
        run: python -m pip install --upgrade cffi setuptools pytest numpy pyscf==2.13.1 coverage

      - name: Measure the Python package
        if: matrix.leg.name == 'coupling'
        run: |
          cat > "$RUNNER_TEMP/coveragerc" <<EOF
          [run]
          parallel = true
          relative_files = true
          source_pkgs = moist
          data_file = $GITHUB_WORKSPACE/build/python.coverage

          [paths]
          moist =
              python/moist
              */build/python/moist
          EOF
          site=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "import coverage; coverage.process_startup()" > "$site/moist-coverage.pth"

      - name: Set compiler environment
        run: |
          echo "FC=gfortran" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Point gcov at the gcc 14 toolchain
        run: |
          sudo ln -sf "$(command -v gcov-14)" /usr/local/bin/gcov
          gcov --version | head -n1

      - name: Build with coverage instrumentation
        run: |
          meson setup build -Db_coverage=true ${{ matrix.leg.setup }} \
            "-Dfortran_args=['-fprofile-update=atomic','-fprofile-abs-path']" \
            "-Dc_args=['-fprofile-update=atomic','-fprofile-abs-path']"
          meson compile -C build

      - name: Run tests
        env:
          OMP_NUM_THREADS: 1
          COVERAGE_PROCESS_START: ${{ matrix.leg.name == 'coupling' && format('{0}/coveragerc', runner.temp) || '' }}
        run: |
          meson test -C build ${{ matrix.leg.tests }} \
            --timeout-multiplier 4 --print-errorlogs

      - name: Generate Cobertura XML coverage report
        run: |
          mkdir -p build/meson-logs
          # --include-internal-functions is needed due to gfortran's procedure naming
          gcovr -r . build \
            -e subprojects \
            -e '.*solventgeometries\.inc' \
            -e '.*_libmoist\.c' \
            --include-internal-functions \
            --gcov-ignore-errors=no_working_dir_found \
            -x -o build/meson-logs/coverage.xml

      - name: Generate Python coverage report
        if: matrix.leg.name == 'coupling'
        run: |
          python -m coverage combine --rcfile="$RUNNER_TEMP/coveragerc"
          python -m coverage xml --rcfile="$RUNNER_TEMP/coveragerc" \
            -o build/meson-logs/python-coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ matrix.leg.name == 'coupling' && 'build/meson-logs/coverage.xml,build/meson-logs/python-coverage.xml' || 'build/meson-logs/coverage.xml' }}
          flags: ${{ matrix.leg.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

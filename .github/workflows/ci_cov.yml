name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: '14'

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build liblapack-dev libunwind-dev gcovr

      - name: Set compiler environment
        run: |
          echo "FC=gfortran" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Point gcov at the gcc 14 toolchain
        run: |
          sudo ln -sf "$(command -v gcov-14)" /usr/local/bin/gcov
          gcov --version | head -n1

      - name: Build with coverage instrumentation
        run: |
          meson setup build -Db_coverage=true \
            "-Dfortran_args=['-fprofile-update=atomic','-fprofile-abs-path']" \
            "-Dc_args=['-fprofile-update=atomic','-fprofile-abs-path']"
          meson compile -C build

      - name: Run tests
        run: meson test -C build --suite moist --print-errorlogs

      - name: Generate Cobertura XML coverage report
        run: |
          mkdir -p build/meson-logs
          # --include-internal-functions is mandatory for Fortran: gcovr drops
          # every symbol starting with '__' as compiler-internal, and gfortran
          # mangles all module procedures as __<module>_MOD_<procedure>. Without
          # it roughly 93% of src/ is silently discarded from the report.
          # solventgeometries.inc (included by src/moist/data/solvents.f90) is
          # recorded by gcov as a bare name relative to the build directory,
          # which gcovr cannot open; it holds only data statements anyway.
          gcovr -r . build \
            -e subprojects \
            -e '.*solventgeometries\.inc' \
            --include-internal-functions \
            --gcov-ignore-errors=no_working_dir_found \
            -x -o build/meson-logs/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/meson-logs/coverage.xml
          flags: fortran
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

[build-system]
requires = [
  "meson-python",
  "cffi",
  "setuptools",
  "meson>=1.2.3,!=1.8.0",
]
build-backend = "mesonpy"

[project]
name = "MOIST"
dynamic = ["version"]
authors = [{"name" = "Lukas Wittmann"}]
description = "Python API for MOIST"
readme = "README.rst"
license.text = "LGPL-3.0-or-later"
urls.repository = "https://github.com/lukaswittmann/moist"
urls.homepage = "https://readthedocs.org/projects/moist"
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Fortran",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
  "cffi",
  "numpy",
]
optional-dependencies.pyscf = ["pyscf"]
optional-dependencies.test = [
  "pytest",
  "pytest-cov",
  "pyscf",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers -p no:cacheprovider"
testpaths = ["tests"]

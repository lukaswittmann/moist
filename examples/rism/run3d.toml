# moist model rism3d examples/rism/chloride.xyz -p examples/rism/run3d.toml
closure = "KH"
correction = "PC+"
finite_size = "hunenberger"

[system]
solvent = "water"
charge = -1.0

[potential]
lj = "uff"
charges = "fixed"
q = [-1.0]  # electrons, one value per atom

[grid]
kind = "cartesian"
nx = 64
ny = 64
nz = 64
dr = 0.6  # bohr
margin = 10.0  # bohr

[convergence]
tolerance = 1e-7

[solver]
name = "JFNK"

[solvent]
theory = "RISM"
closure = "KH"

[solvent.convergence]
tolerance = 1e-11

[solvent.potential]
lj = "cspce"
charges = "cspce"
mixing = "lorentz-berthelot"

# moist model rism3d examples/rism/alanine.xyz -p examples/rism/run3d-molecular.toml
closure = "KH"
correction = "PC+"

[potential]
# First covering table wins: GAFF2 types, UFF for atoms GAFF2 leaves
lj = ["gaff2", "uff"]
charges = "none"  # LJ only; give per-atom q with charges = "custom" for the zwitterion

[grid]
kind = "molecular"
nrad = 50
angular_degree = 17
rmax = 10.0  # bohr
becke_k = 3
dr = 0.6  # bohr
kbuffer = 2.0  # bohr
nufft_tolerance = 1e-10

[convergence]
tolerance = 1e-7

[solver]
name = "JFNK"

[solvent]
name = "water"
temperature = 298.15  # K
theory = "RISM"
closure = "KH"

[solvent.convergence]
tolerance = 1e-11

[solvent.potential]
# First covering choice wins: SPC/E models for water, tables and generic LJ otherwise
lj = ["cspce", "gaff2", "uff", "tm"]
charges = ["spce", "resp-solvent"]
